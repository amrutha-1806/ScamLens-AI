<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="logoShieldBg" x1="40" y1="5" x2="40" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E1D38" />
      <stop offset="50%" stop-color="#091427" />
      <stop offset="100%" stop-color="#040914" />
    </linearGradient>

    <!-- Outer Shield Border Gradient -->
    <linearGradient id="logoShieldBorder" x1="12" y1="8" x2="68" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="35%" stop-color="#14B8A6" />
      <stop offset="70%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Scanning Lens Ring Gradient -->
    <linearGradient id="logoLensRing" x1="22" y1="22" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Central Pupil Glow -->
    <radialGradient id="logoPupilGlow" cx="40" cy="40" r="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#67E8F9" />
      <stop offset="75%" stop-color="#06B6D4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#091427" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="aiBadgeBg" x1="222" y1="18" x2="256" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
  </defs>

  <!-- ICON GROUP -->
  <g transform="translate(0, 0)">
    <!-- Outer Shield -->
    <path
      d="M40 8 C57 8, 68 13, 68 24 C68 50, 54 68, 40 76 C26 68, 12 50, 12 24 C12 13, 23 8, 40 8 Z"
      fill="url(#logoShieldBg)"
      stroke="url(#logoShieldBorder)"
      stroke-width="2.5"
      stroke-linejoin="round"
    />

    <!-- Inner Shield Trim -->
    <path
      d="M40 13 C53 13, 62 17, 62 26 C62 48, 50 63, 40 70 C30 63, 18 48, 18 26 C18 17, 27 13, 40 13 Z"
      stroke="#06B6D4"
      stroke-opacity="0.25"
      stroke-width="1"
      stroke-dasharray="2 2"
    />

    <!-- Scanning Lens Ring -->
    <circle
      cx="40"
      cy="40"
      r="18"
      stroke="url(#logoLensRing)"
      stroke-width="2"
      stroke-dasharray="22 3 5 3"
      stroke-linecap="round"
    />

    <!-- Reticle Ticks -->
    <line x1="40" y1="18" x2="40" y2="24" stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round" />
    <line x1="40" y1="56" x2="40" y2="62" stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round" />
    <line x1="18" y1="40" x2="24" y2="40" stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round" />
    <line x1="56" y1="40" x2="62" y2="40" stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round" />

    <!-- Inner Lens Ring -->
    <circle cx="40" cy="40" r="11" stroke="#14B8A6" stroke-width="1.4" />

    <!-- Center Pupil Glow -->
    <circle cx="40" cy="40" r="6.5" fill="url(#logoPupilGlow)" />
    <circle cx="40" cy="40" r="2.8" fill="#FFFFFF" />

    <!-- Specular Highlight -->
    <path d="M30 30 A15 15 0 0 1 47 25" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8" />
  </g>

  <!-- TEXT GROUP -->
  <!-- SCAMLENS Wordmark -->
  <text x="84" y="42" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">SCAMLENS</text>

  <!-- AI Badge -->
  <rect x="238" y="20" width="34" height="25" rx="6" fill="url(#aiBadgeBg)" stroke="#22D3EE" stroke-width="1.2" />
  <text x="255" y="38" font-family="'Space Mono', monospace, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">AI</text>

  <!-- Tagline -->
  <text x="85" y="60" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#22D3EE" letter-spacing="0.2">See the risk before you click.</text>
</svg>
