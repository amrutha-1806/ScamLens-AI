<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldBg" x1="50" y1="6" x2="50" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E1D38" />
      <stop offset="50%" stop-color="#091427" />
      <stop offset="100%" stop-color="#040914" />
    </linearGradient>

    <!-- Outer Shield Border Gradient -->
    <linearGradient id="shieldBorder" x1="16" y1="8" x2="84" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="35%" stop-color="#14B8A6" />
      <stop offset="70%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Scanning Lens Ring Gradient -->
    <linearGradient id="lensRing" x1="28" y1="28" x2="72" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Central Pupil Glow -->
    <radialGradient id="pupilGlow" cx="50" cy="50" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="28%" stop-color="#67E8F9" />
      <stop offset="70%" stop-color="#06B6D4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#091427" stop-opacity="0" />
    </radialGradient>

    <!-- Radar / Lens Pulse Glow -->
    <filter id="lensGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Protective Shield Silhouette -->
  <path
    d="M50 7 C72 7, 85 14, 85 28 C85 60, 68 83, 50 93 C32 83, 15 60, 15 28 C15 14, 28 7, 50 7 Z"
    fill="url(#shieldBg)"
    stroke="url(#shieldBorder)"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Subtle Inner Shield Trim -->
  <path
    d="M50 13 C68 13, 79 19, 79 30 C79 57, 64 76, 50 85 C36 76, 21 57, 21 30 C21 19, 32 13, 50 13 Z"
    stroke="#06B6D4"
    stroke-opacity="0.22"
    stroke-width="1.2"
    stroke-dasharray="3 2"
  />

  <!-- Optical Scanning Lens - Outer Sensor Ring -->
  <circle
    cx="50"
    cy="48"
    r="23"
    stroke="url(#lensRing)"
    stroke-width="2.5"
    stroke-dasharray="28 4 6 4"
    stroke-linecap="round"
    filter="url(#lensGlow)"
  />

  <!-- Scanning Reticle - Crosshair Ticks -->
  <line x1="50" y1="21" x2="50" y2="28" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="68" x2="50" y2="75" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" />
  <line x1="23" y1="48" x2="30" y2="48" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" />
  <line x1="70" y1="48" x2="77" y2="48" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" />

  <!-- Inner Optical Aperture Ring -->
  <circle
    cx="50"
    cy="48"
    r="14"
    stroke="#14B8A6"
    stroke-width="1.8"
    stroke-opacity="0.9"
  />

  <!-- Iris Aperture Blades / Scan Targets -->
  <circle cx="50" cy="48" r="8" fill="url(#pupilGlow)" />
  <circle cx="50" cy="48" r="3.5" fill="#FFFFFF" />

  <!-- Lens Specular Glare Arc -->
  <path
    d="M37 36 A19 19 0 0 1 58 30"
    stroke="#FFFFFF"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-opacity="0.75"
  />
</svg>
